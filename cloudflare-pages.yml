name: Deploy Kamba Market frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Write Cloudflare API config
        env:
          KAMBA_API_BASE: ${{ secrets.KAMBA_API_BASE }}
        run: |
          node -e "require('fs').writeFileSync('public/config.js', \"window.__KAMBA_API_BASE__ = \" + JSON.stringify(process.env.KAMBA_API_BASE || '') + \";\\n\")"
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=kamba-market
